version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/uploads:/app/app/uploads
      - ./backend/app/references:/app/app/references
      - backend_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/visioninspect.db
      - SECRET_KEY=${SECRET_KEY:-insecure-dev-key-change-me}
      - CORS_ORIGINS=http://localhost:5173

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend_db:
